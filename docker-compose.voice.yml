# Optional voice services on the same Linux GPU host as the portal.
# See docs/guide/voice.md for source checkouts, model downloads and GPU architecture.
services:
  whisper:
    profiles: [voice]
    build:
      context: ${WHISPER_SOURCE:-./voice-runtime/whisper.cpp}
      dockerfile: .devops/main-cuda.Dockerfile
    restart: unless-stopped
    gpus: all
    ports:
      - "127.0.0.1:8178:8080"
    volumes:
      - ${WHISPER_MODELS:-./voice-runtime/whisper.cpp/models}:/models:ro
    entrypoint: ["/app/build/bin/whisper-server"]
    command: ["--host", "0.0.0.0", "--port", "8080", "--model", "/models/ggml-base.bin", "--language", "auto"]
  breeze:
    profiles: [voice]
    build:
      context: ${BREEZE_SOURCE:-./voice-runtime/breeze-tts}
      dockerfile: docker/Dockerfile
      args:
        FLASH_ATTN_CUDA_ARCHS: ${FLASH_ATTN_CUDA_ARCHS:-86}
    restart: unless-stopped
    gpus: all
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - ${BREEZE_MODEL_DIR:-./voice-runtime/Breeze-TTS-2}:/models/breeze:ro
    command: ["python", "-m", "breeze_infer.api", "/models/breeze", "--host", "0.0.0.0", "--port", "7860"]
  # Multilingual alternative: one audio.cpp process serving Chatterbox speech and
  # Qwen3-ASR recognition, both of which speak languages Breeze does not.
  # VOICE_GPU picks the GPU, so the session model can keep the other one.
  audiocpp:
    profiles: [voice-multilingual]
    image: ${AUDIOCPP_IMAGE:-ghcr.io/0xshug0/audio.cpp:full-cuda13}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VOICE_GPU:-0}"]
              capabilities: [gpu]
    ports:
      - "127.0.0.1:7871:7871"
    volumes:
      - ${AUDIOCPP_MODELS:-./voice-runtime/audio-cpp}:/models:ro
      - ./deploy/voice-multilingual/server.json:/config/server.json:ro
    command: ["server", "--config", "/config/server.json", "--host", "0.0.0.0"]
