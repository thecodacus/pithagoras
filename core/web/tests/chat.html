<script>
// With `&count=1`: React tells a hook of this name about every commit (as its devtools are told), and this one counts how often each
// component named in `window.watched` ran, by the name of its function. `window.drawn` has the counts. One of an
// extension's, whose bundle is minified, is known instead by the first element it draws: by a class it has, or an
// attribute (`window.drawsWith`), which an extension's spec sets before the page loads (`page.addInitScript`).
if (location.search.includes('count=1')) {
  // The portal's tests' stand-in for an extension (tests/fixtures/extensions/console) is not minified: its name is its own.
  window.watched = ['CopyAction', 'ChildItem', 'ConsolePanel'];
  window.drawsWith = window.drawsWith || {};

    supportsFiber: true, isDisabled: false, renderers: new Map(),

    onCommitFiberRoot(_id, root) {
      // As the devtools do: a fiber whose child is the one it had before did not run anything below itself, and what
      // flags it carries then are from a draw long ago.
      const walk = (fiber, was) => {
        const type = fiber.type, own = typeof type === 'function' ? type.name : type && type.type && type.type.name;
        // The bundler numbers a function that shares its name with the memo around it ("JobOutput2").
        const name = own && own.replace(/\d+$/, '');

        if (fiber.flags & 1 && window.watched.includes(name)) window.drawn[name] = (window.drawn[name] || 0) + 1;
        if (fiber.flags & 1 && (typeof type === 'function' || (type && typeof type.type === 'function'))) {
          let host = fiber.child;
          while (host && typeof host.type !== 'string') host = host.child;
          const props = (host && host.memoizedProps) || {};
          for (const [as, by] of Object.entries(window.drawsWith)) {
            const found = by.className ? String(props.className || '').split(' ').includes(by.className) : by.attribute in props;
            if (found) window.drawn[as] = (window.drawn[as] || 0) + 1;
          }
        }
        if (was && fiber.child === was.child) return;
        for (let child = fiber.child; child; child = child.sibling) walk(child, child.alternate);
      };
      walk(root.current, root.current.alternate);
    },
  };
}
