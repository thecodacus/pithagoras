name: Tests

# What a pull request has to pass, and what a published image waits for: docker.yml
# runs these jobs first. A push to main is tested there, so it is not tested twice.
on:
  pull_request:
  workflow_call:

# Read only, and the checkout's token is not left in .git/config for the code under test to find.
permissions:
  contents: read

jobs:
  # The server's tests, among them the upgrade of a database from before schema
  # versions (test/upgrade-unversioned), and the root unit tests with the i18n check.
  server:
    runs-on: ubuntu-latest
    # A hung test is a failed run after twenty minutes, not after the six hours GitHub allows.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A Chromium for the browser tools' test (test/browser-tools), which drives one over its debugging port.
      - run: npx playwright install --with-deps chromium
      # The extensions as the portal ships them, built: the tests list the ones in extensions/ by the halves they have.
      - run: npm run build:extensions
      - run: npm test

  # The type check of the web app and its build, which is also what the image runs, the extensions' builds, and
  # the line between them and core (scripts/check-boundaries.mjs).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:boundaries
      - run: npm run build -w core/web
      - run: npm run build:extensions

  # The browser tests, against the web app's dev server and a mocked portal. A few still fail
  # now and then on a busy machine, so a test that fails is tried once more before it counts.
  # They run in two halves at once, each on its own machine: one after the other they no longer
  # finish in the time a job is given.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: browser (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --retries=1 --shard=${{ matrix.shard }}/2
